apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dsys601-workload-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: dsys601-workload.rules
      rules:
        - alert: DSYS601PodCrashLooping
          expr: |
            max_over_time(
              kube_pod_container_status_waiting_reason{namespace="demo-app", reason="CrashLoopBackOff"}[5m]
            ) >= 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Container {{ $labels.container }} in pod {{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff repeatedly over the last 5 minutes."
        - alert: DSYS601ContainerMemoryNearLimit
          expr: |
            (
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{namespace="demo-app", container!="", container!="POD"}
              )
              /
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{namespace="demo-app", resource="memory"}
              )
            ) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} in pod {{ $labels.pod }} is near its memory limit"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has used more than 90% of its memory limit for 10 minutes (currently {{ $value | humanizePercentage }})."
        - alert: DSYS601PodNotReady
          expr: |
            (
              max by (namespace, pod) (
                kube_pod_status_ready{namespace="demo-app", condition="true"}
              ) == 0
            )
            and on (namespace, pod)
            (
              max by (namespace, pod) (
                kube_pod_status_phase{namespace="demo-app", phase=~"Pending|Running|Unknown"}
              ) == 1
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} has been not-ready for 5 minutes"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has not passed its readiness check for more than 5 minutes, so it is not receiving traffic."
        - alert: DSYS601NodeUnderPressure
          expr: |
            max by (node, condition) (
              kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"}
            ) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} reports {{ $labels.condition }}"
            description: "The kubelet on {{ $labels.node }} has reported {{ $labels.condition }} for more than 10 minutes and may start evicting pods. In this Kind lab all nodes share one VM, so this usually means the whole host is short of this resource."
